name: Release
on:
  push:
    branches-ignore:
      - gitbook-updates
    paths-ignore:
      - docs/**
jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Ensure that git uses your token with admin access to the repo
          token: ${{ secrets.ADMIN_TOKEN }}
          fetch-depth: 0
      - run: git fetch --tags --depth=1 origin +refs/tags/*:refs/tags/*
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - name: Auto release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
        run: |
          # Workaround for npm workspace bug with optional dependencies
          # See: https://github.com/npm/cli/issues/4828
          # npm ci doesn't properly install optional deps in workspaces
          npm install --no-save
          cd packages/ui
          npm install --no-save
          npm run build
          cd ../..
          npx auto shipit
