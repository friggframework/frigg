# Isolated databases for the canary harness, on NON-default ports so they never
# clash with a project's own running stack (which usually binds 5432 / 27017).
# Start everything with:  docker compose up -d
services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: frigg_canary_test
        ports:
            - '5433:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 5s
            timeout: 5s
            retries: 10

    # MongoDB must run as a replica set — Prisma requires it for transactions.
    mongodb:
        image: mongo:7
        command: ['--replSet', 'rs0', '--bind_ip_all']
        ports:
            - '27018:27017'
        healthcheck:
            test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
            interval: 5s
            timeout: 5s
            retries: 10

    # One-shot: initialise the rs0 replica set, then exit.
    mongodb_init:
        image: mongo:7
        depends_on:
            mongodb:
                condition: service_healthy
        network_mode: 'service:mongodb'
        volumes:
            - ./mongo-init.sh:/mongo-init.sh:ro
        entrypoint: ['bash', '/mongo-init.sh']
        restart: 'no'
