version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: frigg-postgres
    environment:
      POSTGRES_USER: frigg
      POSTGRES_PASSWORD: frigg
      POSTGRES_DB: frigg
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frigg"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
